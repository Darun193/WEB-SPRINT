<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Проверка результатов распознавания</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <header>
  <h1>Проверка результатов распознавания</h1>

  <form class="toolbar">
  <form class="toolbar">
  <div class="field">
    <label for="search">Поиск по результатам</label>
    <input
      type="text"
      id="search"
      name="search"
      placeholder="Введите текст"
    />
  </div>

  <div class="field">
    <label for="status">Статус</label>
    <select id="status" name="status">
      <option value="all">Все</option>
      <option value="new">Новый</option>
      <option value="approved">Подтверждён</option>
      <option value="rejected">Отклонён</option>
    </select>
  </div>

  <button type="button">Применить</button>
</form>

</header>

<main>
  <section class="results-grid" aria-labelledby="results-title">
    <h2 id="results-title">Результаты распознавания</h2>

    <article class="correct">
      <h3>Результат 1</h3>
      <p><code>AB1234</code></p>
      <p>Confidence: <strong>96%</strong></p>
    </article>

    <article class="wrong">
      <h3>Результат 2</h3>
      <p><code>CD5678</code></p>
      <p>Confidence: <strong>84%</strong></p>
    </article>

    <article class="correct">
      <h3>Результат 3</h3>
      <p><code>EF9012</code></p>
      <p>Confidence: <strong>71%</strong></p>
    </article>
  </section>
</main>

<footer>
  <p>Найдено результатов: <strong>3</strong></p>
</footer>

  </body>
</html>
