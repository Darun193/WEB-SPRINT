<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Проверка результатов распознавания</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <header>
  <h1>Проверка результатов распознавания</h1>

  <form class="toolbar">
  <form class="toolbar">
  <div class="field">
    <label for="search">Поиск по результатам</label>
    <input
      
  id="search-input"
  type="text"
  placeholder="Filter results"
>
  </div>

  <div class="field">
   <label for="status-filter">Status</label>

<select id="status-filter">
  <option value="all">All</option>
  <option value="unreviewed">Unreviewed</option>
  <option value="correct">Correct</option>
  <option value="wrong">Wrong</option>
</select>
  </div>

  <button type="button">Применить</button>
</form>

</header>

<main>
  <section id="results-container" class="results-grid">
</section>
</main>

<footer>
  Точность: <strong><span id="accuracy">0%</span></strong>
</footer>
<script type="module" src="./script.js"></script>
  </body>
</html>
